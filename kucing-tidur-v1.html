<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kucing Tidur</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --card:#fff4e1; --ink:#3b2a2e; --line:#3b2a2e; --txt:#3b2a2e; --dim:#a58c86; --panel:#ffd9b8; --chip:#ffffff; --pillbg:#3b2a2e; --pilltx:#fff4e1;
  --peach:#ff9a62; --pink:#ff8fa3; --mint:#5ed3a1; --amber:#ffb02e; --red:#ff5a5f; --yellow:#ffc928; --blue:#5aa9ff;
  --num:'Segoe UI Black','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Arial,sans-serif;
  --scale:1; --right:18px; --bottom:62px;
}
body.dark{--card:#2b1f24; --line:#ff9a62; --txt:#fff2e6; --dim:#9a8a8a; --panel:#4a3640; --chip:rgba(255,255,255,.08); --pillbg:#fff2e6; --pilltx:#2b1f24}
html,body{width:100%;height:100%;background:transparent!important;overflow:hidden;
  font-family:'Segoe UI','Trebuchet MS',Arial,sans-serif;color:var(--txt);pointer-events:none;user-select:none;-webkit-font-smoothing:antialiased}
body.demo{background:linear-gradient(135deg,#3a3f4a,#0c0d10)!important}

.hud{position:fixed;right:var(--right);bottom:var(--bottom);width:392px;height:204px;zoom:var(--scale)}
body.hasmusic .hud{height:242px}
body.pos-bl .hud{right:auto;left:var(--right)}
body.pos-center .hud{right:50%;margin-right:-196px}

/* kartu */
.card{position:absolute;left:0;top:40px;width:380px;height:156px;border-radius:26px;background:var(--card);border:3px solid var(--line)}
.card::before{content:"";position:absolute;left:5px;top:5px;right:-8px;bottom:-8px;border-radius:26px;background:var(--ink);opacity:.4;z-index:-1}
body.dark .card::before{background:#000;opacity:.5}
.mascot{position:absolute;left:10px;top:12px;width:128px;height:128px;border-radius:22px;background:var(--panel);border:3px solid var(--line);overflow:hidden}
.mascot svg.cat{width:100%;height:100%;display:block}

/* kucing */
.cat .ear,.cat .face{fill:#ffc27a;stroke:#3b2a2e;stroke-width:3;stroke-linejoin:round}
.cat .earin{fill:#ff9fb0;stroke:none}
.cat .stripe{fill:none;stroke:#d98b3a;stroke-width:3;stroke-linecap:round}
.cat .cheek{fill:#ff8fa3;opacity:.55}
.cat .sclera{fill:#fff;stroke:#3b2a2e;stroke-width:2.5}
.cat .pupil{fill:#3b2a2e}.cat .hl{fill:#fff}
.cat .ln{fill:none;stroke:#3b2a2e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cat .whisk{stroke-width:2;opacity:.7}
.cat .nose{fill:#ff7f96;stroke:#3b2a2e;stroke-width:1.6;stroke-linejoin:round}
.cat .m-open{fill:#7a2a3a;stroke:#3b2a2e;stroke-width:2.6}
.cat .sweat{fill:#8fd8ff;stroke:#3b2a2e;stroke-width:2}
.cat .z{font:900 16px 'Segoe UI Black','Arial Black',sans-serif;fill:#ff8fa3;stroke:#3b2a2e;stroke-width:.8;paint-order:stroke;opacity:0}
.cat .eyes-closed,.cat .eyes-panic,.cat .m-wave,.cat .m-open,.cat .sweat,.cat .zzz{display:none}
.cat.sleep .eyes-open{display:none} .cat.sleep .eyes-closed{display:inline} .cat.sleep .zzz{display:inline}
.cat.tense .m-smile{display:none} .cat.tense .m-wave{display:inline} .cat.tense .sweat{display:inline}
.cat.panic .eyes-open,.cat.panic .m-smile{display:none} .cat.panic .eyes-panic,.cat.panic .m-open,.cat.panic .sweat{display:inline}
.cat .tilt{transform-box:view-box;transform-origin:64px 112px;transition:transform .5s ease}
.cat.sleep .tilt{transform:rotate(7deg) translateY(4px)}
.cat .head{transform-box:view-box;transform-origin:64px 112px}
.cat.sleep .head{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.04)}}
.cat.wake .head{animation:wakepop .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes wakepop{0%{transform:scale(.88,.8)}100%{transform:scale(1,1)}}
.cat.panic .head,.cat.tense .head{animation:cshake .22s linear infinite}
.cat.tense .head{animation-duration:.5s}
@keyframes cshake{0%,100%{transform:translate(0,0)}25%{transform:translate(1.6px,-1px)}75%{transform:translate(-1.6px,1px)}}
.cat:not(.sleep) .eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.cat.sleep .z{animation:zf 2.8s ease-in-out infinite}
.cat.sleep .z2{animation-delay:.9s}.cat.sleep .z3{animation-delay:1.8s}
@keyframes zf{0%{opacity:0;transform:translate(-4px,8px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}

/* angka */
.spd{position:absolute;left:154px;top:10px;display:flex;align-items:baseline;gap:6px}
.spd b{font:400 68px/1 var(--num);letter-spacing:-2px;color:var(--txt);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.spd b.mad{color:var(--peach)} .spd b.fury{color:var(--red)}
.spd span{font:800 13px var(--num);letter-spacing:1.5px;color:var(--peach)}
.card.off .spd b,.card.off .r2,.card.off .r3{opacity:.45}
.r2{position:absolute;left:156px;top:84px;display:flex;align-items:center;gap:10px;transition:opacity .3s}
.gp{background:var(--pillbg);color:var(--pilltx);border-radius:999px;padding:2px 11px;font:800 11px var(--num);letter-spacing:1px;white-space:nowrap}
.odo{font:700 10px var(--num);color:var(--dim);letter-spacing:1px;white-space:nowrap}
.odo b{color:var(--txt);font-size:12px;letter-spacing:1.5px;font-weight:700}
.r3{position:absolute;left:156px;top:110px;width:214px;height:24px;display:flex;align-items:center;gap:8px;transition:opacity .3s}
.fg,.eg{display:flex;align-items:center;gap:4px}
.fg{width:100px}
.fg svg.fish{width:15px;height:15px;fill:var(--peach);flex:none}
.bar{flex:1;height:9px;border-radius:5px;background:rgba(120,90,90,.2);overflow:hidden}
.bar>div{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--peach),var(--pink));transition:background .2s}
.r3 b{font:800 10px var(--num);color:var(--txt);width:27px;text-align:right;flex:none}
.fg.mid .bar>div{background:var(--amber)} .fg.low .bar>div{background:var(--red)}
.fg.mid b,.eg.mid b{color:#e08a00} .fg.low b,.eg.low b{color:var(--red)}
.eg{width:104px;gap:1px}
.eg b{margin-left:3px}
.eg svg.paw{flex:none}

/* ikon */
.chip{position:absolute;left:328px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);background:var(--chip);display:grid;place-items:center;color:var(--dim);transition:background .2s,color .2s}
.chip svg{width:16px;height:16px}
.chip svg.st{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip b{font:400 15px var(--num);line-height:1}
.chip.h1{background:var(--yellow);color:#3b2a2e}
.chip.h2{background:var(--blue);color:#fff}
.chip.belt.ok{background:var(--mint);color:#1f4a3a}
.chip.belt.warn{background:var(--red);color:#fff;animation:blink2 .6s steps(1) infinite}
@keyframes blink2{50%{opacity:.4}}
.card.off .chip{opacity:.45}

/* bubble (greeting / engine / mood) */
.welcome{position:absolute;left:14px;top:2px;max-width:330px;padding:5px 14px;border-radius:16px;background:#fff;border:2.5px solid #3b2a2e;
  font:800 13px var(--num);color:#3b2a2e;white-space:nowrap;opacity:0;transform-origin:44px 100%}
.welcome::after{content:"";position:absolute;left:36px;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2.5px solid #3b2a2e;border-bottom:2.5px solid #3b2a2e;transform:rotate(45deg)}
.welcome.show{animation:bub 3.6s ease both}
@keyframes bub{0%{opacity:0;transform:scale(.4) translateY(12px)}8%{opacity:1;transform:scale(1.1)}14%{transform:scale(1)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-14px) scale(.96)}}

/* musik */
.music{display:none;position:absolute;left:0;top:206px;width:380px;height:32px;border-radius:999px;background:var(--ink);color:#fff4e1;border:3px solid var(--ink);align-items:center;gap:8px;padding:0 12px 0 5px;overflow:hidden}
body.dark .music{background:#fff2e6;color:#2b1f24;border-color:#ff9a62}
body.hasmusic .music{display:flex}
.disc{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle,#ff8fa3 0 17%,#2a1c20 18% 38%,#4a3640 39% 44%,#2a1c20 45%);border:1.5px solid rgba(255,255,255,.3)}
.music.playing .disc{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mt{flex:1;overflow:hidden;white-space:nowrap;font:700 11px var(--num);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.mt span{display:inline-block;padding-right:40px}
.mt.scroll span{animation:marq var(--md,10s) linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.eq i{display:block;width:3px;height:100%;border-radius:2px;background:#ff8fa3;transform-origin:bottom;transform:scaleY(.25);animation:eq .7s ease-in-out infinite alternate;animation-play-state:paused}
.eq i:nth-child(2){animation-duration:.55s}.eq i:nth-child(3){animation-duration:.85s}.eq i:nth-child(4){animation-duration:.62s}
.music.playing .eq i{animation-play-state:running}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.tag{font:900 9px var(--num);letter-spacing:1px;background:#ff5a5f;color:#fff;border-radius:6px;padding:1px 5px;flex:none}
#ytwrap{position:fixed;left:-9999px;top:0;width:200px;height:200px;overflow:hidden}
body.showvideo #ytwrap{position:absolute;left:auto;right:0;top:auto;bottom:100%;width:200px;height:113px;margin-bottom:8px;border-radius:14px;border:3px solid var(--line);pointer-events:none}
#dbg{position:fixed;left:6px;top:6px;font:10px monospace;color:#0f0;background:rgba(0,0,0,.7);padding:4px 6px;display:none;max-width:260px;white-space:pre-wrap}
</style>
</head>

4" x1="0" x2="1" y1="0" y2="0"><stop id="psa4" offset="0" stop-color="#ff8fa3"/><stop id="psb4" offset="0" stop-color="rgba(120,90,90,.2)"/></linearGradient></defs><g fill="url(#pg4)"><ellipse cx="12" cy="16" rx="5.6" ry="4.6"/><circle cx="4.8" cy="10.5" r="2.4"/><circle cx="9.3" cy="5.8" r="2.5"/><circle cx="14.7" cy="5.8" r="2.5"/><circle cx="19.2" cy="10.5" r="2.4"/></g></svg><b id="vEng">100%</b></div>

<script>
(function () {
  'use strict';

  /* ================= STATE ================= */
  var S = { engine:false, speedMs:0, rpm:0, fuel:1, health:1, gear:0,
            head:0, left:false, right:false, belt:false, odo:0, mode:1, locked:null };  // locked: null = belum ada data
  var D = { speed:0, rpm:0, fuel:1, health:1 };
  var known = { belt:false, engine:false };   // true kalau game pernah kirim datanya

  var UNITS = ['KMH','MPH','KNOTS'];
  var MULT  = [3.6, 2.23694, 1.94384];     // m/s -> unit
  var MAXV  = [220, 140, 120];

  var LOCK_CLOSED = 'M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z';
  var LOCK_OPEN   = 'M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-9h-1V6a5 5 0 0 0-9.9-1h2A3 3 0 0 1 15 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2z';

  function $(id){ return document.getElementById(id); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function num(v){ v = Number(v); return isFinite(v) ? v : 0; }

  /* ================= API (dipanggil game) ================= */
  function B(s){            // boolean yang toleran: true/1/"1"/"true"/"on"
    if (typeof s === 'string'){ s = s.toLowerCase(); return !(s === '' || s === '0' || s === 'false' || s === 'off' || s === 'null' || s === 'undefined'); }
    return !!s;
  }
  function parseInd(v){     // 0 mati, 1 kiri, 2 kanan, 3 hazard (atau teks)
    if (typeof v === 'string'){
      v = v.toLowerCase();
      if (v === 'left' || v === 'l') return [true, false];
      if (v === 'right' || v === 'r') return [false, true];
      if (v === 'both' || v === 'hazard' || v === 'hazards' || v === 'all') return [true, true];
      v = Number(v);
    }
    if (v === true) return [true, true];
    v = num(v);
    return [(v & 1) !== 0, (v & 2) !== 0];
  }

  window.setEngine         = function (s){ S.engine = B(s); known.engine = true; };
  window.setSpeed          = function (v){ S.speedMs = Math.max(0, num(v)); };   // m/s
  window.setRPM            = function (v){ S.rpm = clamp(num(v), 0, 1); };
  window.setFuel           = function (v){ S.fuel = clamp(num(v), 0, 1); };
  window.setHealth         = function (v){ S.health = clamp(num(v), 0, 1); };
  window.setGear           = function (v){ S.gear = v; };
  window.setHeadlights     = function (v){ S.head = num(v); };                   // 0 off, 1 on, 2 high
  window.setLeftIndicator  = function (s){ S.left = B(s); };
  window.setRightIndicator = function (s){ S.right = B(s); };
  window.setSeatbelts      = function (s){ S.belt = B(s); known.belt = true; };
  window.setSpeedMode      = function (m){ S.mode = clamp(Math.round(num(m)), 0, 2); };
  window.setOdometer       = function (v){ S.odo = Math.max(0, num(v)); };       // miles

  // Alias sen (kalau game kirim gabungan / nama lain)
  window.setIndicators = window.setIndicator = window.setTurnSignals = window.setTurnSignal =
  window.setSignals = window.setSignal = window.setBlinkers = function (a, b){
    if (arguments.length >= 2){ S.left = B(a); S.right = B(b); return; }
    var r = parseInd(a); S.left = r[0]; S.right = r[1];
  };
  window.setHazard = window.setHazards = function (s){ if (B(s)){ S.left = true; S.right = true; } else { S.left = false; S.right = false; } };

  // Kunci kendaraan (template asli TIDAK punya fungsi ini; aktif kalau server kirim salah satu nama ini)
  window.setLocked = window.setLock = window.setDoorLock = window.setDoorsLocked =
  window.setVehicleLock = window.setVehicleLocked = window.setCarLock = window.setLockStatus =
    function (s){ S.locked = B(s); };
  window.setDoorLockStatus = function (v){      // status GTA: 2,3,4,5,6,7,10 = kekunci
    if (typeof v === 'boolean' || typeof v === 'string') { S.locked = B(v); return; }
    v = num(v); S.locked = (v === 2 || v === 3 || v === 4 || v === 5 || v === 6 || v === 7 || v === 10);
  };

  // fallback kalau game kirim lewat postMessage
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || typeof d !== 'object') return;
    if ('engine' in d) setEngine(d.engine);

    if (yt.err) setTitle(ytErrText(yt.err));
    else if (yt.ready){
      try { var d = yt.player.getVideoData(); if (d && d.title) setTitle(d.title); } catch (e) {}
    }
  }
  function musicSync(){
    if (!yt.player || !yt.ready || yt.err) return;
    try {
      if (yt.want){ yt.player.setVolume(MVOL); if (yt.state !== 1 && yt.state !== 3) yt.player.playVideo(); }
      else if (yt.state === 1 || yt.state === 3) yt.player.pauseVideo();
    } catch (e) {}
  }
  (function initMusic(){
    var src = QS.get('yt');
    if (!src || QS.get('music') === '0') return;
    var p = parseYT(src);
    if (!p.ids.length && !p.list){ document.body.classList.add('hasmusic'); setTitle('Link YouTube tidak valid'); return; }
    yt.ids = p.ids; yt.list = p.list;
    document.body.classList.add('hasmusic');
    if (QS.get('video') === '1') document.body.classList.add('showvideo');
    setTitle('Menunggu mesin nyala...');
    window.onYouTubeIframeAPIReady = function (){
      var vars = { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, loop: 1 };
      var opt = { width: 200, height: QS.get('video') === '1' ? 113 : 200, playerVars: vars,
        events: {
          onReady: function (){ yt.ready = true; try { yt.player.setVolume(MVOL); } catch (e) {} updateMusicUI(); musicSync(); },
          onStateChange: function (e){ yt.state = e.data; updateMusicUI(); },
          onError: function (e){ yt.err = e.data; updateMusicUI(); },
          onAutoplayBlocked: function (){ setTitle('Autoplay diblokir oleh browser game'); }
        } };
      if (yt.list && !yt.ids.length){ vars.listType = 'playlist'; vars.list = yt.list; }
      else { opt.videoId = yt.ids[0]; vars.playlist = yt.ids.length > 1 ? yt.ids.slice(1).join(',') : yt.ids[0]; }
      try { yt.player = new YT.Player('ytp', opt); } catch (e) { setTitle('Pemutar YouTube gagal dimuat'); }
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function (){ setTitle('Tidak bisa memuat YouTube (internet / diblokir)'); };
    document.head.appendChild(tag);
    setInterval(function (){ updateMusicUI(); musicSync(); }, 2500);   // ulang kalau autoplay sempat gagal
  })();

  /* ================= RENDER ================= */
  var HEART_PAW = 5;
  var el = {
    card:$('card'), cat:$('cat'), speed:$('vSpeed'), unit:$('vUnit'), gear:$('vGear'), odo:$('vOdo'),
    mFuel:$('mFuel'), fFuel:$('fFuel'), vFuel:$('vFuel'), mEng:$('mEng'), vEng:$('vEng'),
    lamp:$('cLamp'), lampLines:$('lampLines'), belt:$('cBelt'), bTxt:$('bTxt')
  };
  var A1 = 60, A2 = 100, mood = 0, engPrev = null, wakeUntil = 0, lastBubble = 0;
  var TXT = { hi: 'Halo, %N%!', on: 'Brrm! Ayo jalan!', off: 'Zzz... tidur dulu ya', m1: 'Pelan-pelan dong!', m2: 'AAAA! Aku takut!!' };
  if (QS.get('angry')) A1 = clamp(num(QS.get('angry')), 5, 300);
  if (QS.get('sakit')) A2 = clamp(num(QS.get('sakit')), A1 + 1, 400);
  if (QS.get('hi')) TXT.hi = QS.get('hi').slice(0, 30);
  if (QS.get('bon')) TXT.on = QS.get('bon').slice(0, 30);
  if (QS.get('boff')) TXT.off = QS.get('boff').slice(0, 30);
  setTimeout(function (){ el.bTxt.textContent = TXT.hi.replace('%N%', QS.get('name') || 'Dante'); }, 0);
  function bubble(text){ el.bTxt.textContent = text; lastBubble = performance.now(); showWelcome(); }

  function setPaws(p, lvl){
    var key = Math.round(clamp(p, 0, 1) * 100) + '|' + lvl;
    if (last.pk === key) return; last.pk = key;
    var col = lvl === 'low' ? '#ff5a5f' : lvl === 'mid' ? '#ffb02e' : '#ff8fa3';
    for (var k = 0; k < HEART_PAW; k++){
      var fk = clamp(p * HEART_PAW - k, 0, 1).toFixed(3), a = $('psa' + k), b = $('psb' + k);
      a.setAttribute('offset', fk); b.setAttribute('offset', fk); a.setAttribute('stop-color', col);
    }
  }

  function frame(){
    try {
      var now = performance.now(), m = S.mode, on = !!S.engine;
      var target = S.speedMs * MULT[m];
      D.speed  += (target - D.speed) * 0.25;
      D.fuel   += (S.fuel - D.fuel) * 0.2;
      D.health += (S.health - D.health) * 0.2;
      if (Math.abs(target - D.speed) < 0.05) D.speed = target;

      // mesin nyala / mati -> kucing bangun / tidur + bubble + musik
      if (known.engine){
        if (engPrev === null) engPrev = on;
        else if (engPrev !== on){
          engPrev = on;
          wakeUntil = on ? now + 650 : 0;
          bubble(on ? TXT.on : TXT.off);
          yt.want = on; musicSync();
        }
      }
      if (last.ytw === undefined){ last.ytw = 1; yt.want = on && known.engine; }
      if (yt.want !== (on && known.engine)){ yt.want = on && known.engine; musicSync(); }

      // mood dari kecepatan
      var mph = (D.speed / MULT[m]) * 2.23694, pm = mood;
      if (mph > A2) mood = 2;
      else if (mood === 2 && mph > A2 - 3) mood = 2;
      else if (mph > A1) mood = 1;
      else if (mood >= 1 && mph > A1 - 3) mood = 1;
      else mood = 0;
      if (on && mood > pm && now - lastBubble > 6000) bubble(mood === 2 ? TXT.m2 : TXT.m1);

      var st = !on ? 'sleep' : mood === 2 ? 'panic' : mood === 1 ? 'tense' : 'awake';
      setCls('cat', el.cat, 'cat ' + st + (now < wakeUntil ? ' wake' : ''));
      setCls('card', el.card, 'card' + (on ? '' : ' off'));

      setText('spd', el.speed, String(Math.round(D.speed)));
      setCls('spdc', el.speed, mood === 2 ? 'fury' : mood === 1 ? 'mad' : '');
      setText('unit', el.unit, UNITS[m]);
      var g = (S.gear === 0 || S.gear === '0' || S.gear === 'N' || S.gear === '' || S.gear == null) ? 'N' : String(S.gear);
      setText('gear', el.gear, g);
      setText('odo', el.odo, ('0000000' + Math.floor(S.odo)).slice(-7));

      var f = D.fuel, fcl = f < 0.15 ? 'low' : f < 0.35 ? 'mid' : '';
      el.fFuel.style.width = (clamp(f, 0, 1) * 100).toFixed(1) + '%';
      setText('fuel', el.vFuel, Math.round(f * 100) + '%');
      setCls('fuelc', el.mFuel, 'fg' + (fcl ? ' ' + fcl : ''));

      var h = D.health, hcl = h < 0.25 ? 'low' : h < 0.55 ? 'mid' : '';
      setPaws(h, hcl);
      setText('eng', el.vEng, Math.round(h * 100) + '%');
      setCls('engc', el.mEng, 'eg' + (hcl ? ' ' + hcl : ''));

      setCls('lamp', el.lamp, 'chip' + (S.head === 2 ? ' h2' : S.head === 1 ? ' h1' : ''));
      el.lamp.style.top = '14px';
      if (last.lampd !== S.head){ last.lampd = S.head;
        el.lampLines.setAttribute('d', S.head === 2 ? 'M9 8H3M9 12H3M9 16H3' : 'M9 8L3 10M9 12l-6 2M9 16l-6 2'); }
      setCls('bt', el.belt, 'chip belt' + (S.belt ? ' ok' : (on ? ' warn' : '')));
      el.belt.style.top = '54px';
      try { checkBeep(now); } catch (e) {}
    } catch (err) {
      if (window.__dbg) window.__dbg('ERR ' + err.message);
    }
    requestAnimationFrame(frame);
  }
  // demo: mesin mati 4 detik tiap 16 detik biar kelihatan tidurnya
  if (QS.get('demo')) setInterval(function (){ S.engine = (((performance.now() / 1000) | 0) % 16) < 12; }, 500);

  requestAnimationFrame(frame);   // mulai render duluan, fitur tambahan di bawah gak boleh ngeblok ini

  /* ================= URL OPTIONS ================= */
  var q = new URLSearchParams(location.search);
  var root = document.documentElement;
  if (q.get('scale'))  root.style.setProperty('--scale', clamp(num(q.get('scale')), 0.3, 3));
  if (q.get('bottom')) root.style.setProperty('--bottom', q.get('bottom') + 'px');
  if (q.get('right'))  root.style.setProperty('--right',  q.get('right') + 'px');
  if (q.get('pos') === 'bl') document.body.classList.add('pos-bl');
  if (q.get('pos') === 'center') document.body.classList.add('pos-center');
  if (q.get('unit') === 'kmh') S.mode = 0;
  if (q.get('unit') === 'mph') S.mode = 1;

  var API_NAMES = ['setEngine','setSpeed','setRPM','setFuel','setHealth','setGear','setHeadlights',
    'setLeftIndicator','setRightIndicator','setSeatbelts','setSpeedMode','setOdometer',
    'setIndicators','setIndicator','setTurnSignals','setTurnSignal','setSignals','setSignal','setBlinkers',
    'setHazard','setHazards','setLocked','setLock','setDoorLock','setDoorsLocked','setVehicleLock',
    'setVehicleLocked','setCarLock','setLockStatus','setDoorLockStatus'];
  function wrapApi(wrapper){
    API_NAMES.forEach(function (k){
      try {
        var orig = window[k];
        if (typeof orig === 'function') window[k] = wrapper(k, orig);
      } catch (e) {}
    });
  }

  /* ================= WELCOME + ALERT SEATBELT ================= */
  var NAME = q.get('name') || 'Dante';
  try { $('wName').textContent = NAME; } catch (e) {}
  try { if (q.get('msg')) $('wMsg').textContent = String(q.get('msg')).slice(0, 60); } catch (e) {}
  var wel = $('welcome'), WEL_MS = 3600;
  var IDLE_MS = clamp(num(q.get('welcomegap') || 15), 3, 3600) * 1000;
  var VOL = clamp(num(q.get('vol') || 0.8), 0, 1);
  var BEEP_GAP = clamp(num(q.get('beepgap') || 2.5), 0.5, 120) * 1000;
  var BEEP_MOVING = !!q.get('beepmoving');
  var MUTE = !!q.get('mute');
  var welcomeEnd = 0, lastData = 0, lastBeep = 0;

  var snd = null;
  try {
    snd = makeVoice();
    snd.preload = 'auto'; snd.volume = VOL;
  } catch (e) { snd = null; }

  function playBeep(){
    if (!snd || MUTE) return;
    try { snd.currentTime = 0; var p = snd.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  }
  function showWelcome(){
    welcomeEnd = performance.now() + WEL_MS;
    wel.classList.remove('show'); void wel.offsetWidth; wel.classList.add('show');
    lastBeep = 0;
  }
  function checkBeep(now){
    // bunyi kalau mesin nyala & seatbelt belum dipasang (dan game memang ngirim datanya)
    if (!known.belt || !known.engine || !S.engine || S.belt || now < welcomeEnd) { lastBeep = 0; return; }
    if (BEEP_MOVING && S.speedMs * 2.23694 < 5) return;
    if (!lastBeep || now - lastBeep >= BEEP_GAP) { lastBeep = now; playBeep(); }
  }
  // Welcome muncul saat data pertama masuk (naik mobil) atau setelah lama gak ada data
  function touch(){
    var now = performance.now();
    if (!lastData || now - lastData > IDLE_MS) showWelcome();
    lastData = now;
  }
  wrapApi(function (k, orig){ return function (){ touch(); return orig.apply(this, arguments); }; });
  try { document.addEventListener('visibilitychange', function(){ if (!document.hidden) showWelcome(); }); } catch (e) {}

  /* ================= DEBUG (?debug=1) : lihat fungsi apa aja yang dipanggil game ================= */
  if (q.get('debug')) {
    var box = $('dbg'), lines = [], counts = {}, vals = {};
    box.style.display = 'block';
    window.__dbg = function (t){ lines.push(t); if (lines.length > 6) lines.shift(); box.textContent = lines.join('\n'); };
    wrapApi(function (k, orig){ return function (){ counts[k] = (counts[k] || 0) + 1;
          try { vals[k] = JSON.stringify(arguments[0]); } catch (_) { vals[k] = '?'; }
          box.textContent = Object.keys(counts).map(function (n){ return n + ' x' + counts[n] + ' = ' + String(vals[n]).slice(0, 14); }).join('\n') + '\n' + lines.join('\n');
          return orig.apply(this, arguments); }; });
    window.addEventListener('message', function (e){ window.__dbg('msg: ' + String(typeof e.data === 'string' ? e.data : JSON.stringify(e.data)).slice(0, 60)); });
    window.__dbg('debug on - nunggu data dari game...');
  }

  /* ================= DEMO (?demo=1) ================= */
  if (q.get('demo')) {
    document.body.classList.add('demo');
    S.engine = true; S.locked = true; known.belt = true; known.engine = true; showWelcome(); S.odo = 674; S.fuel = 0.62; S.health = 0.88; S.head = 1;
    var t0 = performance.now();
    setInterval(function () {
      var t = (performance.now() - t0) / 1000;
      var v = Math.sin(t / 3) * 0.5 + 0.5;
      S.speedMs = v * 60;
      S.rpm = clamp(0.2 + ((v * 5) % 1) * 0.7, 0, 1);
      S.gear = v < 0.03 ? 0 : Math.max(1, Math.min(5, Math.ceil(v * 5)));
      S.left = Math.floor(t / 4) % 3 === 1; S.right = Math.floor(t / 4) % 3 === 2;
      S.belt = Math.floor(t / 10) % 2 === 0;
      S.locked = Math.floor(t / 6) % 2 === 0;
      S.head = Math.floor(t / 7) % 3;
      S.fuel = clamp(S.fuel - 0.0004, 0.05, 1);
    }, 100);
  }

})();
</script>
</body>
</html>
